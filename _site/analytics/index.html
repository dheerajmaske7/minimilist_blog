<!-- Locked View -->

    <form id="obs-lock-form" class="obs-lock-form">
      <div class="obs-lock-row">
        <input type="password" id="obs-pass-input" class="obs-lock-input" placeholder="Password" autofocus autocomplete="current-password" required />
        <button type="submit" class="obs-lock-submit">Unlock</button>

<!-- Unlocked Dashboard View -->
<div id="obs-unlocked-view" class="obs" style="display: none;">
  <aside class="obs-nav" aria-label="Observability">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
      <p class="obs-brand" style="margin: 0 0.5rem;">AgentGate</p>
      <button type="button" id="obs-lock-btn" class="obs-lock-btn" title="Lock Analytics">🔒 Lock</button>
    </div>
    <button type="button" data-tab="graphs" class="is-active">Graphs</button>
    <button type="button" data-tab="overview">Overview</button>
    <button type="button" data-tab="agents">Agents</button>
    <div class="obs-nav-sub" id="obs-nav-agents-sub" style="display: none;">
      <button type="button" data-subtab="all" class="is-active">↳ All Agents</button>
      <button type="button" data-subtab="compare">↳ Good vs Bad</button>
      <button type="button" data-subtab="good">↳ Good (Stopped)</button>
      <button type="button" data-subtab="bad">↳ Bad (Bypassed)</button>
      <button type="button" data-subtab="paid">↳ Paid (Returned)</button>
    </div>
    <button type="button" data-tab="pages">Pages</button>
    <button type="button" data-tab="events">Events</button>
    <button type="button" data-tab="permissions">Permissions</button>
  </aside>
  <section class="obs-main">
    <header class="obs-top">
      <div>
        <h1>Observability</h1>
        <p id="obs-meta" class="obs-meta">Loading…</p>
      </div>
      <div class="obs-filters" role="group" aria-label="Time range">
        <button type="button" data-range="day">Day</button>
        <button type="button" data-range="week" class="is-active">Week</button>
        <button type="button" data-range="month">30 days</button>
      </div>
    </header>
    <div id="obs-panels"></div>
  </section>
</div>

<script>
(function () {
  const fmt = (n) => Number(n || 0).toLocaleString();
  const money = (n) => "$" + Number(n || 0).toFixed(2);

  const DEFAULT_FALLBACK_RULES = [
    { id: "anthropic", name: "Anthropic (Claude)", category: "AI Assistant", allowed: false, patterns: "claudebot,anthropic-ai,claude-web,claude" },
    { id: "openai", name: "OpenAI (ChatGPT & SearchGPT)", category: "AI Assistant", allowed: false, patterns: "gptbot,chatgpt-user,oai-searchbot,chatgpt,openai" },
    { id: "google_search", name: "Google Search (Googlebot)", category: "Search Engine", allowed: true, patterns: "googlebot,google-inspectiontool" },
    { id: "google_ai", name: "Google AI / Gemini Training (Google-Extended)", category: "AI Training", allowed: false, patterns: "google-extended" },
    { id: "perplexity", name: "Perplexity AI", category: "AI Search", allowed: false, patterns: "perplexitybot,perplexity" },
    { id: "cohere", name: "Cohere AI", category: "AI Training", allowed: false, patterns: "cohere-ai,cohere" },
    { id: "apple", name: "Apple (Applebot & Apple Intelligence)", category: "AI Assistant", allowed: false, patterns: "applebot-extended,applebot" },
    { id: "meta", name: "Meta AI (LLaMA)", category: "AI Training", allowed: false, patterns: "meta-externalagent,facebookbot" },
    { id: "bytedance", name: "ByteDance (Bytespider)", category: "AI Training", allowed: false, patterns: "bytespider" },
    { id: "aggregators", name: "Aggregators (CCBot / Diffbot)", category: "Data Aggregators", allowed: false, patterns: "ccbot,diffbot,amazonbot,youbot" },
    { id: "bing", name: "Bing Search (Bingbot)", category: "Search Engine", allowed: true, patterns: "bingbot" },
    { id: "feed_protection", name: "Feed Protection (/feed.xml)", category: "RSS Protection", allowed: true, patterns: "" }
  ];

  const state = {
    tab: "graphs",
    range: "week",
    data: null,
    charts: [],
    rules: DEFAULT_FALLBACK_RULES.slice(),
    rulesError: null,
    rulesLoading: false,
    toastTimer: null,
    eventPage: 1,
    eventKind: "all",
    eventStatus: "all",
    eventAgent: "all",
    eventQ: "",
    agentView: "all",
  };
  const EVENT_PAGE = 12;

  function getAuthKey() {
    return sessionStorage.getItem("agentgate_auth") || "";
  }

  function setAuthKey(val) {
    if (val) {
      sessionStorage.setItem("agentgate_auth", val);
      document.cookie = `agentgate_auth=${encodeURIComponent(val)}; path=/; max-age=604800; SameSite=Lax`;
    } else {
      sessionStorage.removeItem("agentgate_auth");
      document.cookie = "agentgate_auth=; path=/; max-age=0; SameSite=Lax";
    }
  }

  function isAuthed() {
    return Boolean(getAuthKey());
  }

  async function loadRules() {
    const auth = getAuthKey();
    if (!auth) return;
    try {
      const res = await fetch("/api/bot-rules?auth=" + encodeURIComponent(auth), {
        headers: { "x-admin-key": auth }
      });
      const json = await res.json();
      if (json && json.ok && Array.isArray(json.rules) && json.rules.length) {
        state.rules = json.rules;
        state.rulesError = null;
        return;
      }
      state.rulesError = (json && json.error) || "Bot permissions API returned no rules";
    } catch (err) {
      state.rulesError = err.message || "Could not load bot permissions";
    }
  }

  function showToast(msg) {
    const area = document.getElementById("obs-toast-area");
    if (!area) return;
    area.innerHTML = `<span class="obs-toast">${msg}</span>`;
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => {
      area.innerHTML = "";
    }, 3500);
  }

  function buildRobotsPreview(rules) {
    if (!rules || !rules.length) return "";
    const allowed = [];
    const blocked = [];
    rules.forEach((r) => {
      if (!r.patterns) return;
      r.patterns.split(",").forEach((p) => {
        const trimmed = p.trim();
        if (!trimmed) return;
        const name = trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
        if (r.allowed) {
          allowed.push(`User-agent: ${name}\nAllow: /`);
        } else {
          blocked.push(`User-agent: ${name}\nDisallow: /`);
        }
      });
    });
    return `# AgentGate
User-agent: *
Allow: /

${allowed.join("\n\n")}

${blocked.join("\n\n")}

Sitemap: https://dheeraj-work.netlify.app/sitemap.xml`;
  }

  async function toggleRule(id, allowed) {
    if (!state.rules) return;
    const rule = state.rules.find((r) => r.id === id);
    if (!rule) return;
    rule.allowed = allowed;

    const card = document.querySelector(`.obs-rule-card[data-rule-id="${id}"]`);
    if (card) {
      const statusEl = card.querySelector(".obs-rule-status");
      if (statusEl) {
        statusEl.textContent = allowed ? "On" : "Off";
        statusEl.className = `obs-rule-status ${allowed ? "is-allowed" : "is-gated"}`;
      }
    }
    const previewEl = document.getElementById("obs-robots-preview-code");
    if (previewEl) {
      previewEl.textContent = buildRobotsPreview(state.rules);
    }

    showToast(`${rule.name}: ${allowed ? "free" : "gated"}`);

    const auth = getAuthKey();
    try {
      const res = await fetch("/api/bot-rules?auth=" + encodeURIComponent(auth), {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": auth },
        body: JSON.stringify({ id, allowed }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "Update failed");
      if (data.rules) state.rules = data.rules;
    } catch (err) {
      showToast(`Save failed: ${err.message}`);
    }
  }

  async function actionRules(action) {
    const auth = getAuthKey();
    try {
      showToast("Updating…");
      const res = await fetch("/api/bot-rules?auth=" + encodeURIComponent(auth), {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": auth },
        body: JSON.stringify({ action }),
      });
      const data = await res.json();
      if (data.ok && data.rules) {
        state.rules = data.rules;
        render();
        showToast("Updated");
      }
    } catch (err) {
      showToast(`Error: ${err.message}`);
    }
  }

  const kpi = (label, value) =>
    `<div class="obs-kpi"><span>${label}</span><strong>${value}</strong></div>`;

  const table = (rows, a, b) => {
    if (!rows.length) return "<p class='obs-empty'>None in this range.</p>";
    return `<div class="table-wrap"><table>
      <thead><tr><th>${a}</th><th>${b}</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td>${r.name}</td><td>${fmt(r.count)}</td></tr>`).join("")}</tbody>
    </table></div>`;
  };

  function clearCharts() {
    state.charts.forEach((c) => c.destroy());
    state.charts = [];
  }

  function lineChart(id, labels, datasets) {
    const el = document.getElementById(id);
    if (!el || !window.Chart) return;
    const chart = new Chart(el, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { position: "bottom" } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
      },
    });
    state.charts.push(chart);
  }

  function doughnut(id, labels, values, colors) {
    const el = document.getElementById(id);
    if (!el || !window.Chart) return;
    const chart = new Chart(el, {
      type: "doughnut",
      data: {
        labels,
        datasets: [{ data: values, backgroundColor: colors || ["#007acc", "#333", "#c45c26", "#888", "#9bbc5a"] }],
      },
      options: { plugins: { legend: { position: "bottom" } }, maintainAspectRatio: false },
    });
    state.charts.push(chart);
  }

  function barChart(id, labels, values, label) {
    const el = document.getElementById(id);
    if (!el || !window.Chart) return;
    const chart = new Chart(el, {
      type: "bar",
      data: {
        labels,
        datasets: [{ label, data: values, backgroundColor: "#007acc" }],
      },
      options: {
        indexAxis: "y",
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true, ticks: { precision: 0 } } },
      },
    });
    state.charts.push(chart);
  }

  function syncNav() {
    document.querySelectorAll(".obs-nav > button").forEach((b) => {
      b.classList.toggle("is-active", b.dataset.tab === state.tab);
    });
    const subnav = document.getElementById("obs-nav-agents-sub");
    if (subnav) {
      if (state.tab === "agents") {
        subnav.style.display = "flex";
        subnav.querySelectorAll("button").forEach((b) => {
          b.classList.toggle("is-active", b.dataset.subtab === (state.agentView || "all"));
        });
      } else {
        subnav.style.display = "none";
      }
    }
  }

  function render() {
    syncNav();
    const d = state.data;
    const root = document.getElementById("obs-panels");
    const meta = document.getElementById("obs-meta");
    if (!d) {
      root.innerHTML = "<p>Loading…</p>";
      return;
    }
    clearCharts();
    const store =
      d.store === "turso"
        ? "Turso"
        : d.store === "blobs"
        ? "Netlify Blobs"
        : d.store && String(d.store).includes("analytics.db")
        ? "SQLite · data/analytics.db"
        : (d.store || "store");
    meta.textContent = `Last hit: ${d.updatedAt ? new Date(d.updatedAt).toLocaleString() : "none"} · ${store}`;

    const kpis = `
      <div class="obs-kpis">
        ${kpi("Total requests", fmt(d.totalRequests))}
        ${kpi("Unique visitors", fmt(d.uniqueVisitors))}
        ${kpi("AI agent requests", fmt(d.aiAgentRequests))}
        ${kpi("Human requests", fmt(d.humanRequests))}
        ${kpi("Blog requests", fmt(d.blogRequests))}
        ${kpi("HTTP 402", fmt(d.paymentRequired))}
        ${kpi("Paid requests", fmt(d.paidRequests))}
        ${kpi("Revenue", money(d.revenueUsdc))}
        ${kpi("Good agents", fmt(d.goodVisitors))}
        ${kpi("Bad agents", fmt(d.badVisitors))}
        ${kpi("Paid after 402", fmt(d.paidVisitors))}
      </div>`;

    const series = d.series || [];
    const labels = series.map((r) => r.t);
    const topAgent = d.topAgent ? `${d.topAgent.name} · ${fmt(d.topAgent.count)}` : "—";
    const topBlog = d.topBlog ? `${d.topBlog.name} · ${fmt(d.topBlog.count)}` : "—";

    if (state.tab === "overview") {
      root.innerHTML = `
        ${kpis}
        <div class="obs-highlights">
          <div><span>Top agent</span><strong>${topAgent}</strong></div>
          <div><span>Top blog</span><strong>${topBlog}</strong></div>
        </div>`;
      return;
    }

    if (state.tab === "graphs") {
      root.innerHTML = `
        ${kpis}
        <h2>Traffic</h2>
        <div class="obs-chart"><canvas id="chart-traffic"></canvas></div>
        <div class="obs-split">
          <div>
            <h2>Human vs AI</h2>
            <div class="obs-chart obs-chart-sm"><canvas id="chart-mix"></canvas></div>
          </div>
          <div>
            <h2>Status</h2>
            <div class="obs-chart obs-chart-sm"><canvas id="chart-status"></canvas></div>
          </div>
        </div>
        <h2>402 paywall vs paid</h2>
        <div class="obs-chart"><canvas id="chart-pay"></canvas></div>`;
      lineChart("chart-traffic", labels, [
        { label: "Requests", data: series.map((r) => r.requests), borderColor: "#333", tension: 0.2, fill: false },
        { label: "Human", data: series.map((r) => r.human), borderColor: "#007acc", tension: 0.2, fill: false },
        { label: "AI", data: series.map((r) => r.ai), borderColor: "#c45c26", tension: 0.2, fill: false },
      ]);
      doughnut("chart-mix", ["Human", "AI"], [d.humanRequests || 0, d.aiAgentRequests || 0]);
      doughnut(
        "chart-status",
        (d.status || []).map((s) => s.name),
        (d.status || []).map((s) => s.count)
      );
      lineChart("chart-pay", labels, [
        { label: "402 blocked", data: series.map((r) => r.blocked), borderColor: "#c45c26", tension: 0.2, fill: false },
        { label: "Paid", data: series.map((r) => r.paid), borderColor: "#9bbc5a", tension: 0.2, fill: false },
      ]);
      return;
    }

    if (state.tab === "agents") {
      const view = state.agentView || "all";
      const subtabs = `
        <div class="obs-subtabs" role="tablist" aria-label="Agent groups">
          <button type="button" data-agent-view="all"${view === "all" ? " class=\"is-active\"" : ""}>All Agents</button>
          <button type="button" data-agent-view="compare"${view === "compare" ? " class=\"is-active\"" : ""}>Good vs Bad Agents</button>
          <button type="button" data-agent-view="good"${view === "good" ? " class=\"is-active\"" : ""}>Good Agents (${fmt(d.goodVisitors)})</button>
          <button type="button" data-agent-view="bad"${view === "bad" ? " class=\"is-active\"" : ""}>Bad Agents (${fmt(d.badVisitors)})</button>
          <button type="button" data-agent-view="paid"${view === "paid" ? " class=\"is-active\"" : ""}>Paid Agents (${fmt(d.paidVisitors)})</button>
        </div>`;
      const bindSubs = () => {
        root.querySelectorAll("[data-agent-view]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.agentView = btn.dataset.agentView;
            render();
          });
        });
      };

      if (view === "compare") {
        root.innerHTML = `
          ${subtabs}
          <p class="obs-lead">Paywall compliance comparison: <strong>Good agents</strong> hit HTTP 402 and honored the gate by stopping. <strong>Bad agents</strong> were gated but continued fetching post bodies without paying. <strong>Paid agents</strong> stopped at 402, paid 0.01 USDC on Base, and returned with a valid token.</p>
          <div class="obs-kpis">
            ${kpi("Good (stopped at 402)", fmt(d.goodVisitors))}
            ${kpi("Bad (bypassed 402)", fmt(d.badVisitors))}
            ${kpi("Paid after stopping", fmt(d.paidVisitors))}
          </div>
          <div class="obs-split">
            <div>
              <h2>Paywall Behavior Mix</h2>
              <div class="obs-chart obs-chart-sm"><canvas id="chart-agent-rep"></canvas></div>
            </div>
            <div>
              <h2>Good Agents</h2>
              ${table(d.goodAgents || [], "Agent", "Visitors")}
            </div>
          </div>
          <h2 style="margin-top:1.5rem;">Bad Agents (Attempted Crawl Bypasses)</h2>
          ${table(d.badAgents || [], "Agent", "Visitors")}
          <h2 style="margin-top:1.5rem;">Paid Agents (Verified 0.01 USDC)</h2>
          ${table(d.paidAgents || [], "Agent", "Visitors")}`;
        doughnut(
          "chart-agent-rep",
          ["Good", "Bad", "Paid"],
          [d.goodVisitors || 0, d.badVisitors || 0, d.paidVisitors || 0],
          ["#10b981", "#ef4444", "#007acc"]
        );
        bindSubs();
        return;
      }

      if (view === "good") {
        root.innerHTML = `
          ${subtabs}
          <p class="obs-lead"><strong>Good agents</strong> hit HTTP 402 Payment Required and stopped. They did not attempt to scrape or bypass post gates.</p>
          <div class="obs-kpis">${kpi("Good visitors", fmt(d.goodVisitors))}</div>
          ${table(d.goodAgents || [], "Agent", "Visitors")}`;
        bindSubs();
        return;
      }
      if (view === "bad") {
        root.innerHTML = `
          ${subtabs}
          <p class="obs-lead"><strong>Bad agents</strong> were gated by HTTP 402 but still fetched paywalled posts without paying.</p>
          <div class="obs-kpis">${kpi("Bad visitors", fmt(d.badVisitors))}</div>
          ${table(d.badAgents || [], "Agent", "Visitors")}`;
        bindSubs();
        return;
      }
      if (view === "paid") {
        root.innerHTML = `
          ${subtabs}
          <p class="obs-lead"><strong>Paid agents</strong> stopped at HTTP 402, paid 0.01 USDC on Base, and returned with an access token.</p>
          <div class="obs-kpis">${kpi("Paid after 402", fmt(d.paidVisitors))}</div>
          ${table(d.paidAgents || [], "Agent", "Visitors")}`;
        bindSubs();
        return;
      }

      const names = (d.topAgents || []).map((r) => r.name);
      const counts = (d.topAgents || []).map((r) => r.count);
      root.innerHTML = `
        ${subtabs}
        <p class="obs-lead">Overall agent traffic volume. Select <strong>Good vs Bad Agents</strong> to analyze paywall compliance.</p>
        <div class="obs-kpis">
          ${kpi("Good agents", fmt(d.goodVisitors))}
          ${kpi("Bad agents", fmt(d.badVisitors))}
          ${kpi("Paid after 402", fmt(d.paidVisitors))}
        </div>
        <div class="obs-chart"><canvas id="chart-agents"></canvas></div>
        ${table(d.topAgents || [], "Agent", "Requests")}`;
      barChart("chart-agents", names.slice(0, 12), counts.slice(0, 12), "Requests");
      bindSubs();
      return;
    }

    if (state.tab === "pages") {
      const names = (d.topPages || []).map((r) => r.name);
      const counts = (d.topPages || []).map((r) => r.count);
      root.innerHTML = `
        <p class="obs-lead">What they actually opened. Blog paths are the content agents pay for.</p>
        <div class="obs-chart"><canvas id="chart-pages"></canvas></div>
        ${table(d.topPages || [], "Page", "Requests")}`;
      barChart("chart-pages", names.slice(0, 12), counts.slice(0, 12), "Requests");
      return;
    }

    if (state.tab === "permissions") {
      const groups = [
        { title: "Assistants", ids: ["anthropic", "openai", "perplexity", "apple"] },
        { title: "Training", ids: ["google_ai", "meta", "bytedance", "aggregators", "cohere"] },
        { title: "Search", ids: ["google_search", "bing"] },
        { title: "Feed", ids: ["feed_protection"] },
      ];

      let html = `
        <p class="obs-lead">Slide the toggles to dynamically grant or revoke crawler access. <strong>On:</strong> Free content access & marked <code>Allow</code> in robots.txt. <strong>Off:</strong> HTTP 402 (0.01 USDC) & <code>Disallow</code> in robots.txt.</p>
        <div class="obs-perm-actions">
          <button type="button" class="obs-btn-sm is-primary" id="btn-allow-all">Allow all</button>
          <button type="button" class="obs-btn-sm" id="btn-block-ai">Gate AI</button>
          <button type="button" class="obs-btn-sm" id="btn-reset-rules">Reset</button>
          <a href="/robots.txt" target="_blank" class="obs-btn-sm" style="text-decoration:none;">robots.txt ↗</a>
          <span id="obs-toast-area"></span>
        </div>`;

      const topAgents = d.topAgents || [];

      groups.forEach((group) => {
        const groupRules = (state.rules || DEFAULT_FALLBACK_RULES).filter((r) => group.ids.includes(r.id));
        if (!groupRules.length) return;

        html += `<div class="obs-rule-group-title">${group.title}</div>`;

        groupRules.forEach((r) => {
          let count = 0;
          if (r.patterns) {
            const pats = r.patterns.toLowerCase().split(",");
            topAgents.forEach((a) => {
              if (pats.some((p) => a.name.toLowerCase().includes(p.trim()))) {
                count += a.count;
              }
            });
          }

          html += `
            <div class="obs-rule-card" data-rule-id="${r.id}">
              <div class="obs-rule-left">
                <span class="obs-rule-name">${r.name}</span>
                ${count > 0 ? `<span class="obs-rule-hits">${fmt(count)} hits</span>` : ""}
              </div>
              <div class="obs-rule-right">
                <span class="obs-rule-status ${r.allowed ? "is-allowed" : "is-gated"}">${r.allowed ? "On" : "Off"}</span>
                <label class="obs-switch">
                  <input type="checkbox" data-rule-id="${r.id}" ${r.allowed ? "checked" : ""}>
                  <span class="obs-slider"></span>
                </label>
              </div>
            </div>`;
        });
      });

      html += `
        <details class="obs-robots-card">
          <summary>Dynamic robots.txt preview</summary>
          <pre id="obs-robots-preview-code" class="obs-robots-code">${buildRobotsPreview(state.rules)}</pre>
        </details>`;

      root.innerHTML = html;

      root.querySelectorAll(".obs-switch input[type='checkbox']").forEach((chk) => {
        chk.addEventListener("change", (e) => {
          const ruleId = e.target.dataset.ruleId;
          const isAllowed = e.target.checked;
          toggleRule(ruleId, isAllowed);
        });
      });

      const btnAllow = document.getElementById("btn-allow-all");
      if (btnAllow) btnAllow.addEventListener("click", () => actionRules("allow_all"));

      const btnBlock = document.getElementById("btn-block-ai");
      if (btnBlock) btnBlock.addEventListener("click", () => actionRules("block_all_ai"));

      const btnReset = document.getElementById("btn-reset-rules");
      if (btnReset) btnReset.addEventListener("click", () => actionRules("reset_defaults"));

      return;
    }

    const events = d.recent || [];
    const kinds = Array.from(new Set(events.map((e) => e.kind).filter(Boolean))).sort();
    const agents = Array.from(new Set(events.map((e) => e.agent).filter(Boolean))).sort();
    const statuses = Array.from(new Set(events.map((e) => String(e.status ?? "")).filter(Boolean))).sort();

    const q = (state.eventQ || "").toLowerCase().trim();
    const filtered = events.filter((e) => {
      if (state.eventKind !== "all" && e.kind !== state.eventKind) return false;
      if (state.eventAgent !== "all" && e.agent !== state.eventAgent) return false;
      if (state.eventStatus !== "all" && String(e.status) !== state.eventStatus) return false;
      if (q) {
        const hay = `${e.path || ""} ${e.kind || ""} ${e.agent || ""} ${e.status || ""}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const total = filtered.length;
    const pages = Math.max(1, Math.ceil(total / EVENT_PAGE));
    if (state.eventPage > pages) state.eventPage = pages;
    const start = (state.eventPage - 1) * EVENT_PAGE;
    const pageRows = filtered.slice(start, start + EVENT_PAGE);

    const opt = (list, curr) =>
      `<option value="all">All</option>` +
      list.map((v) => `<option value="${v}"${v === curr ? " selected" : ""}>${v}</option>`).join("");

    let pager = "";
    for (let p = 1; p <= pages; p++) {
      if (pages > 7 && Math.abs(p - state.eventPage) > 2 && p !== 1 && p !== pages) {
        if (p === 2 || p === pages - 1) pager += `<span class="obs-pager-ellipsis">…</span>`;
        continue;
      }
      pager += `<button type="button" class="obs-page${p === state.eventPage ? " is-active" : ""}" data-page="${p}">${p}</button>`;
    }

    root.innerHTML = `
      <p class="obs-lead">${fmt(filtered.length)} of ${fmt(events.length)} requests.</p>
      <div class="obs-event-filters">
        <label>Kind
          <select id="ev-kind">${opt(kinds, state.eventKind)}</select>
        </label>
        <label>Client
          <select id="ev-agent">${opt(agents, state.eventAgent)}</select>
        </label>
        <label>Status
          <select id="ev-status">${opt(statuses, state.eventStatus)}</select>
        </label>
        <label class="obs-event-search">Search
          <input id="ev-q" type="search" placeholder="path, kind, agent…" value="${String(state.eventQ || "").replace(/"/g, "&quot;")}">
        </label>
      </div>
      ${
        pageRows.length
          ? `<div class="table-wrap"><table>
              <thead><tr><th>When</th><th>Kind</th><th>Client</th><th>Path</th><th>Status</th></tr></thead>
              <tbody>${pageRows.map((e) => `<tr>
                <td>${e.ts ? new Date(e.ts).toLocaleString() : ""}</td>
                <td><code>${e.kind || ""}</code></td>
                <td>${e.agent || ""}</td>
                <td>${e.path || ""}</td>
                <td>${e.status || ""}</td>
              </tr>`).join("")}</tbody>
            </table></div>
            <div class="obs-pager">
              <button type="button" class="obs-page" data-page="prev" ${state.eventPage <= 1 ? "disabled" : ""}>Prev</button>
              ${pager}
              <button type="button" class="obs-page" data-page="next" ${state.eventPage >= pages ? "disabled" : ""}>Next</button>
              <span class="obs-pager-meta">Page ${state.eventPage} of ${pages}</span>
            </div>`
          : "<p class='obs-empty'>No events match these filters.</p>"
      }`;

    const bindFilter = (id, key) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("change", () => {
        state[key] = el.value;
        state.eventPage = 1;
        render();
      });
    };
    bindFilter("ev-kind", "eventKind");
    bindFilter("ev-agent", "eventAgent");
    bindFilter("ev-status", "eventStatus");
    const qEl = document.getElementById("ev-q");
    if (qEl) {
      qEl.addEventListener("input", () => {
        state.eventQ = qEl.value;
        state.eventPage = 1;
        state._focusSearch = true;
        render();
      });
      if (state._focusSearch) {
        qEl.focus();
        const len = qEl.value.length;
        qEl.setSelectionRange(len, len);
      }
    }
    root.querySelectorAll("[data-page]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const v = btn.dataset.page;
        if (v === "prev") state.eventPage = Math.max(1, state.eventPage - 1);
        else if (v === "next") state.eventPage = Math.min(pages, state.eventPage + 1);
        else state.eventPage = Number(v) || 1;
        render();
      });
    });
    return;
  }

  async function load() {
    const auth = getAuthKey();
    if (!auth) {
      showAuthScreen();
      return;
    }
    document.getElementById("obs-meta").textContent = "Loading…";
    const [res] = await Promise.all([
      fetch("/api/analytics?range=" + state.range + "&auth=" + encodeURIComponent(auth), {
        headers: { "x-admin-key": auth }
      }),
      loadRules(),
    ]);
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(text.slice(0, 180) || "Analytics request failed");
    }
    if (!res.ok || data.ok === false) {
      if (res.status === 401) {
        setAuthKey("");
        showAuthScreen();
        return;
      }
      throw new Error(data.error || data.errorMessage || data.errorType || "Failed");
    }
    state.data = data;
    render();
  }

  function showAuthScreen() {
    const locked = document.getElementById("obs-locked-view");
    const unlocked = document.getElementById("obs-unlocked-view");
    if (locked) locked.style.display = "flex";
    if (unlocked) unlocked.style.display = "none";
    const passInput = document.getElementById("obs-pass-input");
    if (passInput) {
      passInput.value = "";
      passInput.focus();
    }
  }

  function showDashboard() {
    const locked = document.getElementById("obs-locked-view");
    const unlocked = document.getElementById("obs-unlocked-view");
    if (locked) locked.style.display = "none";
    if (unlocked) unlocked.style.display = "grid";
    load().catch((err) => {
      document.getElementById("obs-panels").innerHTML =
        `<p>Could not load analytics. ${String(err).replace(/</g, "")}</p>`;
    });
  }

  // Bind Login Form
  const loginForm = document.getElementById("obs-lock-form");
  if (loginForm) {
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const passInput = document.getElementById("obs-pass-input");
      const entered = (passInput.value || "").trim();
      const errEl = document.getElementById("obs-lock-error");
      const submitBtn = loginForm.querySelector("button[type='submit']");
      if (!entered) return;

      if (errEl) errEl.style.display = "none";
      const originalText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying…";

      try {
        const res = await fetch("/api/analytics?range=" + state.range + "&auth=" + encodeURIComponent(entered), {
          headers: { "x-admin-key": entered },
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch {}

        if (res.ok && data && data.ok) {
          setAuthKey(entered);
          state.data = data;
          showDashboard();
        } else {
          setAuthKey("");
          if (errEl) {
            errEl.textContent = (data && data.error) || "Incorrect password";
            errEl.style.display = "block";
          }
        }
      } catch (err) {
        if (errEl) {
          errEl.textContent = "Connection error: " + err.message;
          errEl.style.display = "block";
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });
  }

  // Bind Lock Button
  const lockBtn = document.getElementById("obs-lock-btn");
  if (lockBtn) {
    lockBtn.addEventListener("click", () => {
      setAuthKey("");
      showAuthScreen();
    });
  }

  // Bind Top-level Tabs
  document.querySelectorAll(".obs-nav > button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      render();
    });
  });

  // Bind Sidebar Agent Sub-Tabs
  document.querySelectorAll(".obs-nav-sub button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.tab = "agents";
      state.agentView = btn.dataset.subtab;
      render();
    });
  });

  // Bind Range Filters
  document.querySelectorAll(".obs-filters button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.range = btn.dataset.range;
      document.querySelectorAll(".obs-filters button").forEach((b) => b.classList.toggle("is-active", b === btn));
      state.eventPage = 1;
      load().catch((err) => {
        document.getElementById("obs-panels").innerHTML =
          `<p>Could not load analytics. ${String(err).replace(/</g, "")}</p>`;
      });
    });
  });

  // Initial check
  if (isAuthed()) {
    showDashboard();
  } else {
    showAuthScreen();
  }
})();
</script>
