<p>AgentGate analytics from this site’s own edge gate. Google Analytics only sees browsers; this page also counts agents, 402s, and paid access.</p>

<div id="analytics-root" class="analytics">
  <p class="analytics-status">Loading…</p>
</div>

<script>
(async () => {
  const root = document.getElementById("analytics-root");
  const fmt = (n) => Number(n || 0).toLocaleString();
  const money = (n) => "$" + Number(n || 0).toFixed(2);

  const row = (label, value) =>
    `<div class="kpi-row"><span>${label}</span><strong>${value}</strong></div>`;

  const table = (rows, a, b) => {
    if (!rows.length) return "<p>None yet.</p>";
    return `<div class="table-wrap"><table>
      <thead><tr><th>${a}</th><th>${b}</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td>${r.name}</td><td>${fmt(r.count)}</td></tr>`).join("")}</tbody>
    </table></div>`;
  };

  try {
    const res = await fetch("/api/analytics");
    const data = await res.json();
    const updated = data.updatedAt
      ? new Date(data.updatedAt).toLocaleString()
      : "no hits yet";
    const topAgent = data.topAgent
      ? `${data.topAgent.name} · ${fmt(data.topAgent.count)} requests`
      : "—";
    const topBlog = data.topBlog
      ? `${data.topBlog.name} · ${fmt(data.topBlog.count)} requests`
      : "—";

    root.innerHTML = `
      <p class="analytics-updated">Last hit: ${updated}</p>
      <div class="kpi-block">
        ${row("Total requests", fmt(data.totalRequests))}
        ${row("Unique visitors", fmt(data.uniqueVisitors))}
        ${row("AI agent requests", fmt(data.aiAgentRequests))}
        ${row("Human requests", fmt(data.humanRequests))}
        ${row("Blog requests", fmt(data.blogRequests))}
      </div>
      <div class="kpi-block">
        ${row("Top agent", topAgent)}
        ${row("Top blog", topBlog)}
      </div>
      <div class="kpi-block">
        ${row("Revenue", money(data.revenueUsdc))}
        ${row("Paid requests", fmt(data.paidRequests))}
      </div>
      <h2>Requests per agent</h2>
      ${table(data.topAgents || [], "Agent", "Requests")}
      <h2>Top pages</h2>
      ${table(data.topPages || [], "Page", "Requests")}
    `;
  } catch (err) {
    root.innerHTML = `<p>Could not load analytics. ${String(err).replace(/</g, "")}</p>`;
  }
})();
</script>
