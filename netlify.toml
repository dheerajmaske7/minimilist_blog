[build]
  command = "bundle install && bundle exec jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.1.0"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "bundle exec jekyll serve --port 4000 --host 127.0.0.1"
  targetPort = 4000
  port = 8888

[[plugins]]
  package = "netlify-plugin-jekyll-cache"

[[edge_functions]]
  function = "gate-ai-access"
  path = "/*"

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/content"
  status = 200
  force = true

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
  force = true

[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics"
  status = 200
  force = true

[[redirects]]
  from = "/api/bot-rules"
  to = "/.netlify/functions/bot-rules"
  status = 200
  force = true
